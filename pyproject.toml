[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "application-tracker"
version = "0.1.0"
description = "A small local application tracker"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "SQLAlchemy>=2.0,<2.2",
  "Kivy==2.3.1",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.16,<0.18"]

[project.scripts]
application-tracker = "application_tracker.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
